# THROWAWAY. Delete this file and the dpa/debug-tahoe-platypus branch when done.
# See DilumAluthge-packaging/homebrew-tap#140 and #145.
#
# Where the investigation stands. On macos-26-intel every Cocoa XIB compile
# deadlocks:
#     IBLoadDocument -> IBDocument setPlatform: -> IBResourceManager
#       -> +[IBCocoaResourceManager systemMediaRepository]     (dispatch_once)
#         -> systemNSImageNamedResources -> +[NSImage imageNamed:]
#           -> +[ISIconManager sharedInstance]                 (dispatch_once)
#             -> synchronous NSXPC -> mach_msg2_trap           (never returns)
#
# Comparing the two runners isolated one difference. Both report `Aqua`, and
# both have the system-domain iconservicesd and iconservicesagent running:
#
#                                        arm64          x86_64
#   gui/$UID iconservicesagent           pid 379, ok    NOT RUNNING, exit -6
#   MainMenu.xib compiled 5 times        5 passed       0 passed
#
# Exit -6 is SIGABRT: the per-user IconServices agent aborts and stays dead, so
# the synchronous XPC inside dispatch_once has nobody to answer it.
#
# Two things left. The previous kickstart attempt used the wrong service names
# -- they carry an extra component, com.apple.iconservices.iconservicesagent,
# not com.apple.iconservicesagent -- so it reported "Could not find service"
# and proved nothing. And we still do not know WHY the agent aborts, which the
# crash reports should say.
name: debug the Tahoe platypus build

on:
  workflow_dispatch:
  push:
    branches:
      - dpa/debug-tahoe-platypus

permissions:
  contents: read

jobs:
  # arm64 is no longer needed as a control: it is already established at 5/5.
  kickstart_iconservices:
    runs-on: macos-26-intel
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - run: git clone --quiet --depth 1 --branch v5.5.0 https://github.com/sveinbjornt/Platypus.git platypus-src

      - name: Why does the per-user agent abort?
        run: |
          set +e
          set -uo pipefail

          echo "== launchd's view of the per-user agent =="
          launchctl print "gui/$(id -u)/com.apple.iconservices.iconservicesagent" 2>&1 \
            | head -n 40 | sed 's/^/  /'

          echo
          echo "== crash reports mentioning iconservices =="
          mkdir -p reports
          found=0
          for dir in "${HOME}/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "${dir}" ] || continue
            while IFS= read -r r; do
              found=1
              echo "  --- ${r} ---"
              cp "${r}" reports/ 2>/dev/null
              head -n 40 "${r}" | sed 's/^/    /'
            done < <(find "${dir}" -iname '*conservices*' -maxdepth 1 2>/dev/null | head -n 5)
          done
          [ "${found}" -eq 0 ] && echo "  (no IconServices crash reports on disk)"

          echo
          echo "== unified log for iconservicesagent, last 30m =="
          log show --last 30m \
            --predicate 'process CONTAINS "conservices" OR senderImagePath CONTAINS "IconServices"' \
            --style compact 2>&1 | tail -n 40 | sed 's/^/  /'
          exit 0

      - name: Kickstart with the CORRECT service names, then retry
        run: |
          set +e
          set -uo pipefail

          agent="gui/$(id -u)/com.apple.iconservices.iconservicesagent"

          echo "== before =="
          launchctl list 2>/dev/null | grep -i icon || echo "  (none in user domain)"

          echo
          echo "== kickstart the per-user agent (the one that is dead) =="
          launchctl kickstart -k "${agent}" 2>&1 | sed 's/^/  agent:  /'
          echo "== kickstart the system daemon =="
          sudo launchctl kickstart -k system/com.apple.iconservices.iconservicesd 2>&1 \
            | sed 's/^/  daemon: /'
          sudo launchctl kickstart -k system/com.apple.iconservices.iconservicesagent 2>&1 \
            | sed 's/^/  sysagt: /'
          sleep 5

          echo
          echo "== after =="
          launchctl list 2>/dev/null | grep -i icon || echo "  (none in user domain)"
          pgrep -l 'conservices' || echo "  (no processes)"

          echo
          echo "== retry MainMenu.xib five times =="
          ibtool_path="$(xcrun --find ibtool)"
          xib="${PWD}/platypus-src/ScriptExec/Resources/MainMenu.xib"
          mkdir -p out
          hangs=0
          passes=0
          for i in 1 2 3 4 5; do
            "${ibtool_path}" --errors --warnings --notices --module ScriptExec \
              --output-format human-readable-text \
              --compile "out/k-${i}.nib" "${xib}" >/dev/null 2>&1 &
            pid=$!
            waited=0
            while kill -0 "${pid}" 2>/dev/null && [ "${waited}" -lt 60 ]; do
              sleep 3
              waited=$((waited + 3))
            done
            if kill -0 "${pid}" 2>/dev/null; then
              echo "  attempt ${i}: HUNG"
              hangs=$((hangs + 1))
              kill -9 "${pid}" 2>/dev/null
              wait "${pid}" 2>/dev/null
            else
              wait "${pid}"
              echo "  attempt ${i}: ok after ~${waited}s"
              passes=$((passes + 1))
            fi
            pkill -9 -f ibtoold 2>/dev/null
            sleep 2
          done
          echo "AFTER CORRECT KICKSTART: ${passes} passed, ${hangs} hung out of 5"
          echo
          echo "== agent state after the attempts (did it abort again?) =="
          launchctl list 2>/dev/null | grep -i icon || echo "  (none in user domain)"
          exit 0

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iconservices-crash-reports
          path: reports/
          if-no-files-found: warn
