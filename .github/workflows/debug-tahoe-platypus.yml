# THROWAWAY. Delete this file and the dpa/debug-tahoe-platypus branch once the
# ibtool question is settled. See DilumAluthge-packaging/homebrew-tap#140.
#
# `platypus` builds fine on macos-26 (arm64) and on macos-15-intel, but on
# macos-26-intel `ibtool` wedges: it compiled ScriptExec's MainMenu.xib and the
# GUI's SyntaxChecker.xib, then hung on ShellCommandWindow.xib for 4+ minutes
# until the job was killed. Same Xcode 26.6 and Clang 21.0.0 as the arm64
# runner, so this is not a toolchain-version regression -- it needs x86_64 AND
# Xcode 26.6 together.
#
# Three hypotheses, which this workflow is built to tell apart:
#   H1  an ibtool helper has no x86_64 slice, so the parent waits forever
#       -> the lipo/arch dump shows a missing x86_64
#   H2  a nondeterministic deadlock, i.e. the Nth invocation wedges
#       -> ShellCommandWindow.xib succeeds when compiled FIRST
#   H3  something specific to ShellCommandWindow.xib
#       -> it hangs even when compiled FIRST
#
# Each ibtool call is bounded, and a hung one is sampled for a stack trace
# before it is killed, so we learn where inside ibtool it is stuck.
name: debug the Tahoe platypus build

on:
  workflow_dispatch:
  push:
    branches:
      - dpa/debug-tahoe-platypus

permissions:
  contents: read

jobs:
  debug_ibtool:
    runs-on: macos-26-intel
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the Platypus sources
        run: git clone --quiet --depth 1 --branch v5.5.0 https://github.com/sveinbjornt/Platypus.git platypus-src

      # H1: if a helper is arm64-only, the x86_64 parent may block forever
      # waiting on a connection it can never get.
      - name: Architectures of ibtool and its helpers
        run: |
          set -uo pipefail

          ibtool_path="$(xcrun --find ibtool)"
          echo "ibtool: ${ibtool_path}"
          file "${ibtool_path}" || true
          echo "archs: $(lipo -archs "${ibtool_path}" 2>&1 || echo '?')"

          dev_dir="$(xcode-select -p)"
          xcode_app="${dev_dir%/Contents/Developer}"
          echo
          echo "== Interface Builder support binaries =="
          while IFS= read -r f; do
            [ -f "${f}" ] || continue
            printf '%-64s %s\n' "${f#"${xcode_app}"/}" "$(lipo -archs "${f}" 2>&1 || echo '?')"
          done < <(
            find "${xcode_app}/Contents/SharedFrameworks" \
                 "${xcode_app}/Contents/Frameworks" \
                 "${dev_dir}/usr/bin" \
                 -maxdepth 4 -type f \( -name 'ibtool*' -o -name 'IB*' -o -name '*InterfaceBuilder*' \) \
                 2>/dev/null | head -n 40
          )

      - name: Compile each XIB with ibtool, bounded and sampled
        run: |
          set -uo pipefail

          src="${PWD}/platypus-src"
          out="${PWD}/nib-out"
          samples="${PWD}/samples"
          mkdir -p "${out}" "${samples}"
          ibtool_path="$(xcrun --find ibtool)"

          # macOS has no timeout(1). Run ibtool in the background, poll, and if
          # it outlives the budget grab a stack trace before killing it.
          try_xib() {
            label="$1"; module="$2"; xib="$3"; budget="${4:-120}"

            echo "=================================================================="
            echo "[${label}] module=${module}  $(basename "${xib}")"

            "${ibtool_path}" --errors --warnings --notices \
              --module "${module}" \
              --auto-activate-custom-fonts \
              --target-device mac \
              --minimum-deployment-target 11.5 \
              --output-format human-readable-text \
              --compile "${out}/${label}.nib" "${xib}" &
            ib_pid=$!

            waited=0
            while kill -0 "${ib_pid}" 2>/dev/null && [ "${waited}" -lt "${budget}" ]; do
              sleep 5
              waited=$((waited + 5))
            done

            if kill -0 "${ib_pid}" 2>/dev/null; then
              echo "[${label}] RESULT: HUNG (still alive after ${budget}s)"
              echo "[${label}] live ibtool-ish processes:"
              pgrep -fl 'ibtool|IBAgent|IBCocoa|InterfaceBuilder' | sed 's/^/    /' || true
              echo "[${label}] capturing a stack sample..."
              sample "${ib_pid}" 5 -file "${samples}/${label}.txt" >/dev/null 2>&1 \
                || echo "    (sample failed; may need elevated privileges)"
              echo "[${label}] --- sample head ---"
              sed -n '1,80p' "${samples}/${label}.txt" 2>/dev/null || echo "    (no sample captured)"
              kill -9 "${ib_pid}" 2>/dev/null
              wait "${ib_pid}" 2>/dev/null
            else
              wait "${ib_pid}"
              echo "[${label}] RESULT: completed rc=$? after ~${waited}s"
            fi
          }

          # H2 vs H3: compile the suspect FIRST, before any other ibtool call.
          # If it succeeds here but hangs later in sequence, the file is
          # innocent and the failure depends on invocation order.
          echo "##### PHASE 1: the suspect, compiled first #####"
          try_xib "phase1-ShellCommandWindow" Platypus \
                  "${src}/Application/Resources/ShellCommandWindow.xib" 120

          # Then the real build order, to see whether the hang tracks the file
          # or the position in the sequence.
          echo
          echo "##### PHASE 2: the full set, in build order #####"
          try_xib "phase2-1-MainMenu"          ScriptExec "${src}/ScriptExec/Resources/MainMenu.xib" 120
          try_xib "phase2-2-SyntaxChecker"     Platypus   "${src}/Application/Resources/SyntaxChecker.xib" 120
          try_xib "phase2-3-ShellCommandWindow" Platypus  "${src}/Application/Resources/ShellCommandWindow.xib" 120
          try_xib "phase2-4-Editor"            Platypus   "${src}/Application/Resources/Editor.xib" 120
          try_xib "phase2-5-Platypus"          Platypus   "${src}/Application/Resources/Platypus.xib" 180

          echo
          echo "##### SUMMARY #####"
          ls -la "${out}" || true

      - name: Upload stack samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ibtool-samples
          path: samples/
          if-no-files-found: warn
